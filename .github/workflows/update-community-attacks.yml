name: Sync Approved Attacks

# SUPABASE_URL and SUPABASE_READ_KEY (publishable/anon key recommended).
# SUPABASE_SERVICE_KEY remains supported as a fallback for existing installations.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: Validate the live feed without publishing changes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: community-feed-sync
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.check_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Validate live feed without publishing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/sync_community_attacks.py --check

  publish:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.check_only &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Fetch and validate complete approved feed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/sync_community_attacks.py
      - name: Commit and push if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skill/community-attacks.md
          if git diff --staged --quiet; then
            echo "No approved report content changed."
          else
            git commit -m "chore: sync approved community attacks [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
